[string-mod-setting-description]
# Basic ############################
vanilla-beacon-profile-default=Default Factorio 2.0 Pattern. Diminishing returns. {1,0.7071,0.5773,0.5, ...}
vanilla-beacon-profile-overload-non-exclusive=Only 1 beacon can affect an entity. Additional beacons will have no effect. {1,0.5,0.3333,0.25, ...}
vanilla-beacon-profile-overload=Only 1 beacon can affect an entity. Additional beacons will cause the bonus to stop. {1,0}
vanilla-beacon-profile-custom=The format must be numbers separated by commas and no spaces,. Do not include the brackets. If the format is incorrect, it will default to {0}

icons-on-modules-all=All modules (including vanilla) have icons
icons-on-modules-new=Only new added modules have icons
icons-on-modules-none=No modules have icons

speed-in-all-recipes-unchanged=Leaves the vanilla per-recipe allowances for this effect untouched
speed-in-all-recipes-everywhere=Modules in machines and beacons can apply this effect to all recipes
speed-in-all-recipes-nowhere=No machine or beacon can apply this effect to any recipe
productivity-in-all-recipes-unchanged=Leaves the vanilla per-recipe allowances for this effect untouched
