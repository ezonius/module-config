productivity-limits-high=Upper bound (in %) for the total productivity effect on a machine. 100000 = +100000%, effectively uncapped like vanilla. Raise it past +300% to let extreme module setups exceed the vanilla productivity cap on recipes that allow productivity (this also raises the per-recipe maximum productivity, vanilla +300%). Requires a restart.
productivity-limits-low=Lower bound (in %) for the total productivity effect on a machine. Vanilla engine floor is -99.99%. Requires a restart.
speed-limits-high=Upper bound (in %) for the total speed effect on a machine. 100000 = +100000%, effectively uncapped like vanilla. Requires a restart.
speed-limits-low=Lower bound (in %) for the total speed effect on a machine. -80 = -80%, the vanilla engine default. Requires a restart.
consumption-limits-high=Upper bound (in %) for the total energy consumption effect on a machine. 100000 = +100000%, effectively uncapped like vanilla. Requires a restart.
consumption-limits-low=Lower bound (in %) for the total energy consumption effect on a machine. -80 = -80%, the vanilla engine default. Requires a restart.
pollution-limits-high=Upper bound (in %) for the total pollution effect on a machine. 100000 = +100000%, effectively uncapped like vanilla. Requires a restart.
pollution-limits-low=Lower bound (in %) for the total pollution effect on a machine. -80 = -80%, the vanilla engine default. Requires a restart.
quality-limits-high=Upper bound for the total quality effect on a machine, in percent of a quality level (100 = one full quality level). The engine caps quality effects at 100 quality levels (10000%), which is also the vanilla default. Requires a restart.
quality-limits-low=Lower bound for the total quality effect on a machine, in percent of a quality level. 0 = no negative quality effect, the vanilla engine default. Requires a restart.



