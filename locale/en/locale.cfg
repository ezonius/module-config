productivity-speed-extrapolation-exponential_pattern=Each tier i gets value(i) = V_first · 2^(i−1). Only the first value in the {effect} values setting is used; any further values are ignored. Example with value 0.5: 0.5, 1.0, 2.0, 4.0, 8.0, ...\nAll generated values are capped at ±327.66%.
productivity-speed-extrapolation-polynomial_pattern=Each tier i gets value(i) = V_first · i². Only the first value in the {effect} values setting is used; any further values are ignored. Example with value 0.5: 0.5, 2.0, 4.5, 8.0, 12.5, ...\nAll generated values are capped at ±327.66%.
