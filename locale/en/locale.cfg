[mod-setting-description]
more-tabs=Creates a new tab in the inventory that contains all modules and the beacon
icons-on-modules=Which modules should have the numbers added to their icons which denote their tier.
icons-on-beacons=Should modules with an additional number in their icon display their icon while placed in a beacon?
alt-mode-modules-in-beacons=Should alt mode show the contents of a beacon? Useful for when a beacon can hold more than 2 modules.
modules-per-recipe=The amount of the previous tier of modules used to craft the next tier. Does not affect tiers 1-3 of modules
modules-per-result=The amount of modules returned for every craft. Does not affect tiers 1-3 of modules
crafting-time=The amount of time taken to complete a craft. Does not affect tiers 1-3 of modules
tech-cost=Enter a mathematical expression where L is equal to the level of the module. If the expression is invalid for whatever reason, all tech costs will be set to 1. Negative numbers will become positive. Does not affect tiers 1-3 of modules
tech-time=The amount of time taken for science. Does not affect tiers 1-3 of modules

efficiency-in-beacon=Allows modules with efficiency effects to be placed in beacons. Will not act on a recipe which disallows this effect.
speed-in-beacon=Allows modules with speed effects to be placed in beacons. Will not act on a recipe which disallows this effect.
productivity-in-beacon=Allows modules with productivity effects to be placed in beacons. Will not act on a recipe which disallows this effect. \nProductivity in beacons seems to ignore the maximum productivity, beware.
pollution-in-beacon=Allows modules with pollution effects to be placed in beacons. Will not act on a recipe which disallows this effect.
quality-in-beacon=Allows modules with quality effects to be placed in beacons. Will not act on a recipe which disallows this effect.

efficiency-in-all-recipes=Whether modules with an efficiency effect can be placed in recipes.
speed-in-all-recipes=Whether modules with a speed effect can be placed in recipes.
productivity-in-all-recipes=Whether modules with a productivity effect can be placed in recipes.
pollution-in-all-recipes=Whether modules with a pollution effect can be placed in recipes.
quality-in-all-recipes=Whether modules with a quality effect can be placed in recipes.

vanilla-beacon-distribution-effectivity=The base distribution effectivity of a single beacon and the strength of the effects it applies to machines. Default: 1.5
vanilla-beacon-distribution-effectivity-bonus-per-quality-level=How each level of quality adds to the distribution effectivity
vanilla-beacon-supply_area_distance=How far the vanilla beacon can reach
vanilla-beacon-module-slots=How many modules the vanilla beacon can hold
vanilla-beacon-profile=How the distribution effects of multiple beacons scale.
vanilla-beacon-custom-profile=Requires the Vanilla Beacon Profile to be selected to custom. Enter numbers separated by a comma. Example: 1,2,3,4,5,6. Will default to 0 if formatted incorrectly.

max-speed=The highest level of Speed modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-productivity=The highest level of Productivity modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-efficiency=The highest level of Efficiency modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-quality=The highest level of Quality modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.


speed-consumption-extrapolation=Sets how the consumption effect scales across module tiers, extending the series started by the consumption values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no consumption effect is applied.
speed-speed-extrapolation=Sets how the speed effect scales across module tiers, extending the series started by the speed values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no speed effect is applied.
speed-productivity-extrapolation=Sets how the productivity effect scales across module tiers, extending the series started by the productivity values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no productivity effect is applied.
speed-pollution-extrapolation=Sets how the pollution effect scales across module tiers, extending the series started by the pollution values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no pollution effect is applied.
speed-quality-extrapolation=Sets how the quality effect scales across module tiers, extending the series started by the quality values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no quality effect is applied.
speed-consumption-values=Comma-separated effect values, one per tier, applied to the consumption effect (e.g. 0.50,0.60,0.70). The first value sets tier 1, the second tier 2 and so on; the extrapolation pattern fills any remaining tiers. Leave blank to give the consumption effect no value.
speed-speed-values=Comma-separated effect values, one per tier, applied to the speed effect (e.g. 0.50,0.60,0.70). The first value sets tier 1, the second tier 2 and so on; the extrapolation pattern fills any remaining tiers. Leave blank to give the speed effect no value.
speed-productivity-values=Comma-separated effect values, one per tier, applied to the productivity effect (e.g. 0.50,0.60,0.70). The first value sets tier 1, the second tier 2 and so on; the extrapolation pattern fills any remaining tiers. Leave blank to give the productivity effect no value.
speed-pollution-values=Comma-separated effect values, one per tier, applied to the pollution effect (e.g. 0.50,0.60,0.70). The first value sets tier 1, the second tier 2 and so on; the extrapolation pattern fills any remaining tiers. Leave blank to give the pollution effect no value.
speed-quality-values=Comma-separated effect values, one per tier, applied to the quality effect (e.g. 0.50,0.60,0.70). The first value sets tier 1, the second tier 2 and so on; the extrapolation pattern fills any remaining tiers. Leave blank to give the quality effect no value.
efficiency-consumption-extrapolation=Sets how the consumption effect scales across module tiers, extending the series started by the consumption values setting. Constant: adds the same amount each tier. Linear: adds an amount proportional to the tier level. Fibonacci: each tier is the sum of the previous two tiers. Exponential: doubles each tier. Polynomial: grows with the square of the tier level. Disabled: no consumption effect is applied.
