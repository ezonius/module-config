[mod-setting-description]
more-tabs=Creates a new tab in the inventory that contains all modules and the beacon
icons-on-modules=Which modules should have the numbers added to their icons which denote their tier.
icons-on-beacons=Should modules with an additional number in their icon display their icon while placed in a beacon?
alt-mode-modules-in-beacons=Should alt mode show the contents of a beacon? Useful for when a beacon can hold more than 2 modules.
modules-per-recipe=The amount of the previous tier of modules used to craft the next tier. Does not affect tiers 1-3 of modules
modules-per-result=The amount of modules returned for every craft. Does not affect tiers 1-3 of modules
crafting-time=The amount of time taken to complete a craft. Does not affect tiers 1-3 of modules
tech-cost=Enter a mathematical expression where L is equal to the level of the module. If the expression is invalid for whatever reason, all tech costs will be set to 1. Negative numbers will become positive. Does not affect tiers 1-3 of modules
tech-time=The amount of time taken for science. Does not affect tiers 1-3 of modules

efficiency-in-beacon=Allows modules with efficiency effects to be placed in beacons. Will not act on a recipe which disallows this effect.
speed-in-beacon=Allows modules with speed effects to be placed in beacons. Will not act on a recipe which disallows this effect.
productivity-in-beacon=Allows modules with productivity effects to be placed in beacons. Will not act on a recipe which disallows this effect. \nProductivity in beacons seems to ignore the maximum productivity, beware.
pollution-in-beacon=Allows modules with pollution effects to be placed in beacons. Will not act on a recipe which disallows this effect.
quality-in-beacon=Allows modules with quality effects to be placed in beacons. Will not act on a recipe which disallows this effect.

efficiency-in-all-recipes=Whether modules with an efficiency effect can be placed in recipes.
speed-in-all-recipes=Whether modules with a speed effect can be placed in recipes.
productivity-in-all-recipes=Whether modules with a productivity effect can be placed in recipes.
pollution-in-all-recipes=Whether modules with a pollution effect can be placed in recipes.
quality-in-all-recipes=Whether modules with a quality effect can be placed in recipes.

#vanilla-beacon-distribution-effectivity=
vanilla-beacon-distribution-effectivity-bonus-per-quality-level=How each level of quality adds to the distribution effectivity
vanilla-beacon-supply_area_distance=How far the vanilla beacon can reach
vanilla-beacon-module-slots=How many modules the vanilla beacon can hold
vanilla-beacon-profile=How the distribution effects of multiple beacons scale.
vanilla-beacon-custom-profile=Requires the Vanilla Beacon Profile to be selected to custom. Enter numbers separated by a comma. Example: 1,2,3,4,5,6. Will default to 0 if formatted incorrectly.

advanced-mode=When the advanced mode of a pattern is selected, the effect for a tier of module will be calculated with a corresponding formula. Values entered in a manual override will take priority.
advanced-below=The settings below are used to configure the corresponding effect when it has an advanced pattern selected. If a basic pattern is selected, the settings below will do nothing for that effect.
max-speed=The highest level of Speed modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-productivity=The highest level of Productivity modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-efficiency=The highest level of Efficiency modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.
max-quality=The highest level of Quality modules that can be used, if the effect limit is not reached. \nIf the effect limit is reached, effects will be capped at +32767 percent.


