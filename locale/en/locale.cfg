##### Speed
speed-consumption-extrapolation-disabled_pattern=This effect is disabled for all tiers of this module type.
speed-consumption-extrapolation-linear_pattern=Extends the {effect} values series: a base step S is derived from your provided values as S = (V_last − V_second-to-last) ÷ (number of values − 1), then each further tier i gets value(i) = value(i−1) + (i − 1)·S. Example with values 0.5,0.6: 0.5, 0.6, 0.8, 1.1, 1.5, ...\nAll generated values are capped at ±327.66%.
speed-consumption-extrapolation-constant_pattern=Extends the {effect} values series by repeatedly adding the last step: S = V_last − V_second-to-last, then each further tier i gets value(i) = value(i−1) + S. Example with values 0.5,0.6: 0.5, 0.6, 0.7, 0.8, 0.9, ...\nAll generated values are capped at ±327.66%.
speed-consumption-extrapolation-fibonacci_pattern=Extends the {effect} values series: each further tier i gets value(i) = value(i−1) + value(i−2). Example with values 0.5,0.6: 0.5, 0.6, 1.1, 1.7, 2.8, ...\nAll generated values are capped at ±327.66%.
speed-consumption-extrapolation-exponential_pattern=Each tier i gets value(i) = V_first · 2^(i−1). Only the first value in the {effect} values setting is used; any further values are ignored. Example with value 0.5: 0.5, 1.0, 2.0, 4.0, 8.0, ...\nAll generated values are capped at ±327.66%.
speed-consumption-extrapolation-polynomial_pattern=Each tier i gets value(i) = V_first · i². Only the first value in the {effect} values setting is used; any further values are ignored. Example with value 0.5: 0.5, 2.0, 4.5, 8.0, 12.5, ...\nAll generated values are capped at ±327.66%.
